name: VBB stop positions debug APK

on:
  push:
    branches:
      - feature/vbb-stop-positions
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply public-transport-enabler patch
        run: git -C public-transport-enabler apply ../patches/public-transport-enabler-station-board-location.patch

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0'

      - name: Test and build debug APK
        working-directory: androidstudio
        run: |
          bash ./gradlew :oeffi-studio:testNgDebugUnitTest \
            --tests de.schildbach.oeffi.stations.VbbStopPositionsTest \
            --tests de.schildbach.pte.dto.DepartureStationBoardLocationTest \
            --stacktrace
          bash ./gradlew :oeffi-studio:assembleNgDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: oeffi-ng-vbb-stop-positions-debug
          path: androidstudio/oeffi-studio/build/outputs/apk/ng/debug/*.apk
          if-no-files-found: error
          retention-days: 7
